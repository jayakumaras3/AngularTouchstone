<h2 mat-dialog-title>See DOCHEK in Action</h2>
<p class="popup-subtitle">Fill in your details to get started</p>
<div *ngIf="statusMessage" 
     class="status-box" 
     [ngClass]="statusType">
  {{ statusMessage }}
</div>
<mat-dialog-content class="dialogcont">
  <form [formGroup]="form" class="form-container">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Organization</mat-label>
      <input matInput formControlName="company" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email Address</mat-label>
      <input matInput formControlName="email" type="email" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Country</mat-label>
      <input matInput formControlName="city" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Phone Number (optional)</mat-label>
      <input matInput formControlName="phone" type="tel" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width hide-hint">
      <mat-label>Message / Project Details</mat-label>
      <textarea matInput formControlName="message" rows="3" required></textarea>
    </mat-form-field>
    <app-message-field-status [control]="f['message']" [min]="20"></app-message-field-status>

    <div class="turnstile-wrapper">
      <div #turnstileContainer></div>
      @if (f['captchaVerified'].touched && f['captchaVerified'].invalid) {
        <div class="captcha-error-msg" role="alert">
          Please complete CAPTCHA verification.
        </div>
      }
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button
      mat-raised-button
            color="primary"
            (click)="onSubmit()"
            [disabled]="isSubmitting"
          >
            {{ isSubmitting ? 'Submitting...' : 'Submit' }}
          </button>


</mat-dialog-actions>
<app-required-fields-note></app-required-fields-note>
