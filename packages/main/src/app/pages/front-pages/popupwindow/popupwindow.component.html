<h2 mat-dialog-title>Get in Touch</h2>
<div *ngIf="statusMessage" 
     class="status-box" 
     [ngClass]="statusType">
  {{ statusMessage }}
</div>
<mat-dialog-content class="dialogcont">
  <form [formGroup]="form" class="form-container">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Company</mat-label>
      <input matInput formControlName="company" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email ID</mat-label>
      <input matInput formControlName="email" type="email" required />
    </mat-form-field>
<!--
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Contact Number (optional)</mat-label>
      <input matInput formControlName="contact" type="tel" />
    </mat-form-field>-->

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>City</mat-label>
      <input matInput formControlName="city" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Message / Project Details (optional)</mat-label>
      <textarea matInput formControlName="message" rows="3"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button
      mat-raised-button
            color="primary"
            (click)="onSubmit()"
            [disabled]="form.invalid || isSubmitting"
          >
            {{ isSubmitting ? 'Submitting...' : 'Submit' }}
          </button>

  
</mat-dialog-actions>
