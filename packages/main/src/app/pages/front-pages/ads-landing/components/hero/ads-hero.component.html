<section [id]="config.id" class="ads-hero">
  <span class="ads-hero__glow" aria-hidden="true"></span>

  <div class="container">
    <div class="ads-hero__grid">
      <div class="ads-hero__content">
        <span class="ads-hero__attribution">
          <img
            class="ads-hero__attribution-icon"
            src="assets/images/AdsPage/taglogo.png"
            alt=""
            aria-hidden="true"
          />
          <span>{{ attributionText }}</span>
        </span>

        @if (config.eyebrow) {
          <span class="ads-hero__eyebrow">{{ config.eyebrow }}</span>
        }
        <h1 class="ads-hero__heading">{{ config.headline }}</h1>
        <p class="ads-hero__description">{{ config.description }}</p>

        <div class="ads-hero__content-image">
          <img [src]="config.imageUrl" [alt]="config.imageAlt" />
        </div>

        @if (config.ctaLabel) {
          <a
            mat-stroked-button
            color="primary"
            class="ads-hero__cta"
            [href]="'#' + config.ctaFragment"
            (click)="scrollToFragment($event, config.ctaFragment!)"
          >
            {{ config.ctaLabel }}
          </a>
        }
      </div>

      <div class="ads-hero__visual-card">
        <div class="ads-hero__visual-form">
          <mat-card class="ads-hero__form-card">
            <mat-card-content>
              <app-lead-form formId="ads-lead-form" [config]="config.form"></app-lead-form>
            </mat-card-content>
          </mat-card>
        </div>
      </div>
    </div>
  </div>
</section>
