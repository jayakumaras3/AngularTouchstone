<section
  [id]="config.id"
  class="cta-section spacing-top-bottom"
  [class.bg-light-primary]="config.tinted"
  [class.cta-section--reverse]="config.reverse"
>
  <div class="container">
    <div class="cta-section__inner">
      <div class="cta-section__content">
        @if (config.eyebrow) {
          <p class="f-s-14 f-w-600 text-primary m-b-8">{{ config.eyebrow }}</p>
        }
        <h2 class="f-s-40 section-sub-title lh-normal m-b-16">{{ config.heading }}</h2>
        <p class="f-s-18 lh-normal m-b-24">{{ config.description }}</p>
        <a
          mat-flat-button
          color="primary"
          [href]="'#' + config.ctaFragment"
          (click)="scrollToFragment($event, config.ctaFragment)"
        >
          {{ config.ctaLabel }}
        </a>
      </div>

      @if (config.imageUrl) {
        <div class="cta-section__media">
          <img [src]="config.imageUrl" [alt]="config.imageAlt || ''" loading="lazy" class="img-fluid" />
        </div>
      }
    </div>

    @if (config.featureCards) {
      <div class="cta-section__cards m-t-48">
        <app-feature-cards [config]="config.featureCards"></app-feature-cards>
      </div>
    }
  </div>
</section>
