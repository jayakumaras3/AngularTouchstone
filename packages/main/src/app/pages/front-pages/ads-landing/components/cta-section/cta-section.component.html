<section
  [id]="config.id"
  class="cta-section"
  [class.bg-light-primary]="config.tinted"
  [class.cta-section--reverse]="config.reverse"
>
  <div class="container">
    <div class="cta-section__inner">
      <div class="cta-section__content">
        @if (config.eyebrow) {
          <span class="cta-section__eyebrow">{{ config.eyebrow }}</span>
        }
        <h2 class="cta-section__heading">{{ config.heading }}</h2>
        <p class="cta-section__description cta-section__description--multiline">{{ config.description }}</p>
        @if (config.ctaLabel) {
          <a
            mat-flat-button
            color="primary"
            [href]="'#' + config.ctaFragment"
            (click)="scrollToFragment($event, config.ctaFragment!)"
          >
            {{ config.ctaLabel }}
          </a>
        }
      </div>

      @if (config.videoUrl) {
        <div class="cta-section__media">
          <video [src]="config.videoUrl" controls preload="metadata" [attr.aria-label]="config.imageAlt || ''"></video>
        </div>
      } @else if (config.imageUrl) {
        <div class="cta-section__media">
          <img [src]="config.imageUrl" [alt]="config.imageAlt || ''" loading="lazy" />
        </div>
      }
    </div>

    @if (config.featureCards) {
      <div class="cta-section__cards">
        <app-feature-cards [config]="config.featureCards"></app-feature-cards>
      </div>
    }
  </div>
</section>
