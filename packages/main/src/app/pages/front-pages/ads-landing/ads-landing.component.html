@if (config) {
  <main class="ads-landing" [attr.aria-label]="config.campaignName + ' landing page'">
    <app-ads-hero [config]="config.hero"></app-ads-hero>

    @for (section of config.sections; track section.id) {
      <app-cta-section [config]="section"></app-cta-section>
    }

    <section [id]="config.finalCta.id" class="ads-landing__final-cta">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-md-6 m-b-30">
            <h2 class="ads-landing__final-cta-heading">{{ config.finalCta.heading }}</h2>
            @if (config.finalCta.description) {
              <p class="ads-landing__final-cta-description">{{ config.finalCta.description }}</p>
            }
          </div>

          <div class="col-md-6 m-b-30">
            <div class="ads-landing__final-cta-form-shell">
              <mat-card class="ads-landing__final-cta-form-card">
                <mat-card-content>
                  <app-lead-form [formId]="config.finalCta.id" [config]="config.finalCta.form"></app-lead-form>
                </mat-card-content>
              </mat-card>
            </div>
          </div>
        </div>

        @if (config.finalCta.featureCards) {
          <div class="ads-landing__final-cta-cards">
            <app-feature-cards [config]="config.finalCta.featureCards"></app-feature-cards>
          </div>
        }
      </div>
    </section>

    <app-footer></app-footer>
  </main>
}
