<!-- Full-width background section for grid content -->
<section class="cc-grid-section">
  <div class="cc-grid m-b-80">
    <ng-container *ngFor="let cat of categories">
      <div class="cc-card">
        <h2>{{ cat.title }} ({{ cat.count }})</h2>
        <ng-container *ngFor="let sub of cat.subCategories">
          <h3>{{ sub.name }}</h3>
          <ul>
            <li *ngFor="let c of sub.courses; let i = index" [style.--index]="i">
              {{ c.title }}
              <span *ngIf="c.duration" class="course-duration" (click)="navigateToCourseDetails(c)">({{ c.duration }})</span>
            </li>
          </ul>
        </ng-container>
      </div>
    </ng-container>
  </div>
</section>
