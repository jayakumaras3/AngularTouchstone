<section class="pricing-section">
 
<div class="pricing-header">
    <h2 class="text-center heading-blue-bold">Choose the Right Plan For Your Team</h2>
  </div> 
  
  <div class="toggle-buttons">
    <button [class.active]="selectedPlan === 'monthly'" (click)="selectedPlan = 'monthly'">Monthly</button>
    <button [class.active]="selectedPlan === 'yearly'" (click)="selectedPlan = 'yearly'">Yearly</button>
  </div>

  <div class="plans-row">
    <div class="plan-card" *ngFor="let plan of plans[selectedPlan]; let i = index" [class.featured]="i === 2">
      <div class="plan-title">{{ plan.title }}</div>
      <p class="description">{{ plan.description }}</p>

      <div class="price">
        <span class="amount">{{ plan.price }}</span>
        <ng-container *ngIf="plan.period">
          <span class="period">/ {{ plan.period }}</span>
        </ng-container>
      </div>

      <ul class="features">
        <li *ngFor="let feature of plan.features">
          <span class="check">✔</span> {{ feature }}
        </li>
      </ul>

      <button class="plan-btn">{{ plan.button }}</button>
    </div>
  </div>
</section>
