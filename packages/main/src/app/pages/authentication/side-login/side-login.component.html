<!-- MAIN WRAPPER WITH FULL PAGE HEIGHT -->
<div class="blank-layout-container d-flex flex-column min-vh-100">

  <!-- CENTER LOGIN CONTENT SECTION -->
  <div class="login-container flex-grow-1 d-flex align-items-center justify-content-center w-100">

    <div class="row w-100 mx-auto" style="max-width: 1400px;">

      <!-- LEFT IMAGE -->
              <div class="col-lg-7 col-xl-8 bg-gredient p-0 d-none d-lg-block">
                <div class="p-24 d-flex justify-content-center align-items-center h-100">

                  <div class="img-height d-none d-lg-flex justify-content-center align-items-center w-100">
                   <img
                    [src]="'/' + baseUrlpath + 'assets/images/backgrounds/login-bg.svg'"
                    alt="login"
                    class="login-illustration"
                  />
                  </div>

                </div>
          </div>


      <!-- RIGHT LOGIN FORM -->
      <div class="col-lg-5 col-xl-4 p-0">
        <div class="p-32 d-flex justify-content-center align-items-start align-items-lg-center h-100">

          <div class="row justify-content-center w-100">
            <div class="col-lg-9 max-width-form">

              <h4 class="f-w-700 f-s-24 m-0">Welcome to Dochek</h4>

              <form class="m-t-30" [formGroup]="form" (ngSubmit)="submit()">

                <!-- Username -->
                <mat-label class="f-s-14 f-w-600 m-b-12 d-block">Username</mat-label>
                <mat-form-field appearance="outline" class="w-100" color="primary">
                  <input matInput formControlName="username" />
                  @if(f['username'].touched && f['username'].invalid) {
                    <mat-hint class="m-b-16 error-msg">
                      @if(f['username'].errors?.['required']) {
                        <div class="text-error">username is required.</div>
                      }
                    </mat-hint>
                  }
                </mat-form-field>

                <!-- Password -->
                <mat-label class="f-s-14 f-w-600 m-b-12 d-block">Password</mat-label>
                <mat-form-field appearance="outline" class="w-100" color="primary">
                  <input matInput type="password" formControlName="password" />
                  @if(f['password'].touched && f['password'].invalid) {
                    <mat-hint class="m-b-16 error-msg">
                      @if(f['password'].errors?.['required']) {
                        <div class="text-error">Password is required.</div>
                      }
                    </mat-hint>
                  }
                </mat-form-field>

                <div class="d-flex align-items-center m-b-12">
                  <a [routerLink]="['/forgotpassword']"
                     class="text-primary f-w-600 text-decoration-none f-s-14">
                    Forgot Password?
                  </a>
                </div>

                <!-- SUBMIT BUTTON -->
                <button mat-flat-button color="primary" class="w-100" [disabled]="isSubmitting">
                  {{ isSubmitting ? 'Signing In...' : 'Sign In' }}
                </button>

              </form>

            </div>
          </div>

        </div>
      </div>

    </div>

  </div>

  

</div>
<div class="footer">
        <app-footer></app-footer>
      </div>
