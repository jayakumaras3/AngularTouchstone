<!-- 🔙 Back button (left aligned inside 1400px container) -->
<div class="page-container">
  <div class="back-button-wrapper">
    <button mat-flat-button (click)="getBack()">Back</button>
  </div>

  <!-- 🧾 Product Details -->
  <mat-card class="cardWithShadow product-details-card b-1 rounded p-30">
    <div class="row align-items-start">
      <div class="col-lg-6 col-md-6 col-sm-12">
        <img
          [src]="product?.imagePath"
          alt="product"
          class="rounded product-img"
        />
      </div>

      <div class="col-lg-6 col-md-6 col-sm-12 text-start">
        <h2 class="m-t-10 f-w-600" class="producth2">{{ product?.product_name }}</h2>
         <!-- PRICE + DURATION -->
           <div class="d-flex align-items-center justify-content-between m-t-20">

              <!-- LEFT: Price -->
              <span class="f-s-30 f-w-600 text-primary">
                ${{ product.base_price}}
              </span>

              <!-- RIGHT: Language + Duration -->
             <div class="d-flex align-items-center gap-10">
                <span class="info-pill d-flex align-items-center gap-1">
                  Language: <strong class="langcl">{{ product.language }}</strong>
                </span>

                <span class="info-pill d-flex align-items-center gap-1">
                  <i-tabler name="clock" class="icon-14 text-muted"></i-tabler>
                  Duration: {{ product.duration }} min
                </span>
              </div>


            </div>

            <hr class="my-divider">
            <!-- RATING + LANGUAGE -->
            <div class="d-flex align-items-center justify-content-between m-t-10">
              <!-- Left: Rating 
              <div class="d-flex align-items-center gap-1">
                @if (product.rating !== undefined) {
                  @for (star of [1, 2, 3, 4, 5]; track star) {
                    <i-tabler
                      name="star"
                      class="icon-18 text-warning"
                      [ngClass]="getStarClass(star, product.rating)"
                    ></i-tabler>
                  }
                }
              </div>-->

              <!-- Right: Language -->
             
            </div>  
        <div class="m-t-1 f-s-14 f-w-500" [innerHTML]="product.description"></div>
        <ul class="m-t-1 f-s-14 f-w-500">
            <li *ngFor="let obj of product.objectives">{{ obj }}</li>
          </ul>

  </mat-card>

  <!-- 🧩 Related Products -->
 <mat-card class="related-products-card">
  <h6 class="section-title">Related Products</h6>

  <div class="row justify-content-center text-center">
    @for (productcard of relatedProducts; track productcard.id) {
      <div class="col-sm-6 col-md-4 col-lg-3 d-flex justify-content-center">
        <mat-card
          class="cardWithShadow productcard cursor-pointer"
          (click)="navigateToProduct(productcard)"
        >
          <img
            [src]="productcard.imagePath"
            [alt]="productcard.product_name"
            class="product-img"
            mat-card-image
          />

          <mat-card-content class="p-b-24 p-t-12 text-center">
            <mat-card-title class="product-title">
              {{ productcard.product_name }}
            </mat-card-title>

            <!-- ✅ Show categories instead of language
            <div class="categories text-muted f-s-13 m-b-6">
              {{ productcard.categories?.join(', ') }}
            </div> -->

            <div
              class="d-flex justify-content-center align-items-baseline gap-2"
            >
              <h6 class="f-s-16 f-w-600">$ {{ productcard.base_price }}</h6>
              <!-- <span class="f-s-14 text-decoration-line-through text-muted">
                $ {{ productcard.dealPrice }}
              </span> -->
            </div>
          </mat-card-content>
        </mat-card>
      </div>
    }
  </div>
</mat-card>

 <div class="footer">
        <app-footer></app-footer>
  </div>
