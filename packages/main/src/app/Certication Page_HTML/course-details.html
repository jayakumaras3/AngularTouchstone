<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/details.css">
</head>
<body>

  <div id="pageRoot" hidden>
    <div class="course-page-wrap">
      <div class="course-container">

        <button class="back-btn-simple" type="button" id="courseBackBtn">
          <span>Back</span>
        </button>

        <div class="course-card">

          <!-- Left column: image + launch button -->
          <div class="course-image-col">
            <div class="course-image-wrap" id="courseImageWrap"></div>
            <!-- Launch button — shown only when cert is purchased -->
            <div class="course-launch-cta" id="launchSection" hidden>
              <button class="course-launch-btn" type="button" id="launchBtn"></button>
            </div>
          </div>

          <!-- Right column: course info -->
          <div class="course-info-panel">

            <h1 class="course-title" id="courseTitle"></h1>

            <div class="course-cat-row" id="catRow" hidden>
              <span class="course-cat-label">Categories:</span>
              <span class="course-cat-chip" id="catChip"></span>
            </div>

            <div class="course-subcat-row" id="subcatRow" hidden>
              <span class="course-cat-label">Sub Catogeries:</span>
              <span class="course-subcat-chip" id="subcatChip"></span>
            </div>

            <div class="course-meta">
              <div class="meta-chip" id="langChip" hidden>
                <span class="meta-chip-label">Language</span>
                <span class="meta-chip-value" id="langValue"></span>
              </div>
              <div class="meta-chip" id="durChip" hidden>
                <span class="meta-chip-label">Duration</span>
                <span class="meta-chip-value" id="durValue"></span>
              </div>
            </div>

            <hr class="course-divider">

            <div class="course-desc" id="courseDesc" hidden></div>

            <p class="objectives-intro" id="objIntro" hidden>
              At the end of this course, you will be able to:
            </p>
            <ul class="objectives-list" id="objList" hidden></ul>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/course-details.js"></script>
</body>
</html>
