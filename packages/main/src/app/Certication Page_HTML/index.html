<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Certifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/certification.css">
  <link rel="stylesheet" href="css/test-panel.css">
</head>
<body>

  <div id="pageRoot">
    <section class="cert-cards-section">
      <div class="cards-grid" id="cardsGrid">
        <!-- Certification cards are injected here by certifications.js -->
      </div>
    </section>
  </div>

  <!-- Template: Single certification card -->
  <template id="tplCertCard">
    <div class="cert-card">
      <div class="card-image">
        <img loading="lazy" alt="">
      </div>
      <div class="card-body">
        <h3 class="cert-title"></h3>
        <p class="cert-desc"></p>
        <div class="cert-price"></div>
        <div class="stats-row">
          <div class="stat-item">
            <span class="stat-icon"></span>
            <span class="stat-label"></span>
          </div>
          <div class="stat-item">
            <span class="stat-icon"></span>
            <span class="stat-label"></span>
          </div>
          <div class="stat-item">
            <span class="stat-icon"></span>
            <span class="stat-label"></span>
          </div>
        </div>
        <div class="card-footer">
          <button class="details-btn" type="button" data-action="details">View Details</button>
          <button type="button" data-action-btn=""></button>
        </div>
      </div>
    </div>
  </template>

  <!-- ── TEST PANEL — Remove before production ───────────────────────────────── -->
  <div id="testPanel">
    <div id="testPanelHeader">
      <span>&#x1F9EA; Purchase State Tester</span>
      <button id="testPanelToggle" title="Collapse">&#8722;</button>
    </div>
    <div id="testPanelBody"></div>
    <div id="testPanelFooter">
      <button onclick="markAll('PAID')">All PAID</button>
      <button onclick="markAll('NOT_PAID')">All NOT_PAID</button>
    </div>
  </div>
  <!-- ── END TEST PANEL ──────────────────────────────────────────────────────── -->

  <script src="js/app.js"></script>
  <script src="js/certifications.js"></script>
  <script src="js/test-panel.js"></script>
</body>
</html>
