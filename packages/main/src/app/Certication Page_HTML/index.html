<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Certifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/certification.css">
</head>
<body>
  <div id="pageRoot"></div>
  <script src="js/app.js"></script>
  <script src="js/certifications.js"></script>

  <!-- ── TEST PANEL — Remove before production ───────────────────────────────── -->
  <div id="testPanel">
    <div id="testPanelHeader">
      <span>&#x1F9EA; Purchase State Tester</span>
      <button id="testPanelToggle" title="Collapse">&#8722;</button>
    </div>
    <div id="testPanelBody"></div>
    <div id="testPanelFooter">
      <button onclick="markAll('PAID')">All PAID</button>
      <button onclick="markAll('NOT_PAID')">All NOT_PAID</button>
    </div>
  </div>

  <style>
    #testPanel {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 270px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      z-index: 9999;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      color: #f1f5f9;
      overflow: hidden;
    }
    #testPanelHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 14px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #a78bfa;
    }
    #testPanelToggle {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      padding: 0 2px;
    }
    #testPanelToggle:hover { color: #f1f5f9; }
    #testPanelBody {
      padding: 6px 0;
      max-height: 280px;
      overflow-y: auto;
    }
    .tp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
    }
    .tp-row:hover { background: rgba(255,255,255,0.04); }
    .tp-name {
      flex: 1;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
    }
    .tp-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 100px;
      min-width: 62px;
      text-align: center;
      transition: background 0.2s;
    }
    .tp-badge.paid     { background: #10b981; color: #fff; }
    .tp-badge.not-paid { background: #3b82f6; color: #fff; }
    .tp-btn {
      background: #334155;
      border: none;
      color: #f1f5f9;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .tp-btn:hover { background: #475569; }
    #testPanelFooter {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid #334155;
      background: #0f172a;
    }
    #testPanelFooter button {
      flex: 1;
      padding: 7px;
      border: none;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.2s;
    }
    #testPanelFooter button:first-child { background: #10b981; color: #fff; }
    #testPanelFooter button:last-child  { background: #3b82f6; color: #fff; }
    #testPanelFooter button:hover { filter: brightness(1.15); }
  </style>

  <script>
    (function () {
      const CERTS = [
        { id: 1, name: 'CCD-Tech' },
        { id: 2, name: 'HC-LC'    },
        { id: 3, name: 'SDBPS'   },
        { id: 4, name: 'WRWEI'   },
        { id: 5, name: 'CSMBL'   },
        { id: 6, name: 'CTLTE'   },
        { id: 7, name: 'CSFBA'   },
      ];

      function renderRows() {
        const body = document.getElementById('testPanelBody');
        if (!body) return;
        body.innerHTML = CERTS.map(c => {
          const status = purchaseState[c.id] || 'NOT_PAID';
          const cls    = status === 'PAID' ? 'paid' : 'not-paid';
          return `
            <div class="tp-row">
              <span class="tp-name">${c.name}</span>
              <span class="tp-badge ${cls}" id="tp-badge-${c.id}">${status}</span>
              <button class="tp-btn" onclick="tpToggle(${c.id})">Toggle</button>
            </div>`;
        }).join('');
      }

      window.tpToggle = function (id) {
        const current = purchaseState[id] || 'NOT_PAID';
        const next    = current === 'PAID' ? 'NOT_PAID' : 'PAID';
        updatePurchaseStatus(id, next);
        const badge = document.getElementById('tp-badge-' + id);
        if (badge) {
          badge.textContent = next;
          badge.className   = 'tp-badge ' + (next === 'PAID' ? 'paid' : 'not-paid');
        }
      };

      window.markAll = function (status) {
        CERTS.forEach(c => updatePurchaseStatus(c.id, status));
        renderRows();
      };

      // Collapse / expand
      document.getElementById('testPanelToggle').addEventListener('click', function () {
        const body   = document.getElementById('testPanelBody');
        const footer = document.getElementById('testPanelFooter');
        const open   = body.style.display !== 'none';
        body.style.display   = open ? 'none' : 'block';
        footer.style.display = open ? 'none' : 'flex';
        this.textContent     = open ? '+' : '−';
      });

      // Wait for certification cards to appear (async fetch completes), then render rows
      const observer = new MutationObserver(function () {
        if (document.querySelector('.cert-card')) {
          observer.disconnect();
          renderRows();
        }
      });
      observer.observe(document.getElementById('pageRoot'), { childList: true, subtree: true });
    })();
  </script>
  <!-- ── END TEST PANEL ──────────────────────────────────────────────────────── -->
</body>
</html>
