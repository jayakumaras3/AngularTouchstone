<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Reset Password - DOCHEK</title>
    <script>
        (function () {
            var root = document.documentElement;
            function getQueryParam(name) {
                var query = window.location.search || '';
                if (!query || query.length < 2) {
                    return null;
                }

                var parts = query.substring(1).split('&');
                for (var i = 0; i < parts.length; i++) {
                    var pair = parts[i].split('=');
                    if (decodeURIComponent(pair[0] || '') === name) {
                        return decodeURIComponent((pair[1] || '').replace(/\+/g, ' '));
                    }
                }
                return null;
            }

            var forced = getQueryParam('theme');
            var mediaQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
            var prefersDark = mediaQuery ? mediaQuery.matches : false;

            function safeGet(keys) {
                try {
                    for (var i = 0; i < keys.length; i++) {
                        var v = localStorage.getItem(keys[i]);
                        if (v !== null && v !== '') {
                            return v;
                        }
                    }
                } catch (e) {
                    // Some file:// or strict privacy modes can block localStorage.
                }
                return '';
            }

            var savedRaw = safeGet(['theme', 'color-theme', 'app-theme', 'isDarkMode']);
            var saved = String(savedRaw).toLowerCase();

            var forcedDark = forced === 'dark';
            var forcedLight = forced === 'light';
            var savedDark = saved === 'dark' || saved === 'true' || saved === '1' || saved === 'on' || saved === 'enabled';
            var savedLight = saved === 'light' || saved === 'false' || saved === '0' || saved === 'off' || saved === 'disabled';

            // Default to dark for this standalone page unless user explicitly selects light.
            var shouldUseDark = forcedDark || savedDark || (!forcedLight && !savedLight) || prefersDark;

            if (shouldUseDark) {
                root.classList.add('theme-dark');
            } else {
                root.classList.remove('theme-dark');
            }

            if (mediaQuery && !forcedDark && !forcedLight && !savedDark && !savedLight) {
                var onChange = function (e) {
                    if (e.matches) {
                        root.classList.add('theme-dark');
                    } else {
                        root.classList.remove('theme-dark');
                    }
                };

                if (typeof mediaQuery.addEventListener === 'function') {
                    mediaQuery.addEventListener('change', onChange);
                } else if (typeof mediaQuery.addListener === 'function') {
                    mediaQuery.addListener(onChange);
                }
            }
        }());
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a class="header-logo" href="#">
                <img src="assets/images/logos/dark-logo.svg" alt="DOCHEK" class="logo-img">
            </a>
        </div>

        <nav class="header-center">
            <a href="#about">About Us</a>
            <a href="#features">Features</a>
            <a href="#catalog">Course Catalog</a>
            <a href="#contact">Contact</a>
        </nav>

        <div class="header-right">
            <button class="login-btn">Login</button>
        </div>
    </header>

    <main class="main-container">
        <div class="left-section">
            <div class="illustration-frame">
                <img
                    class="security-image"
                    src="assets/images/backgrounds/login-bg.svg"
                    alt="Security illustration – lock and key"
                />
            </div>
        </div>

        <div class="right-section">
            <div class="form-card">
                <h2 class="form-title">Reset Your Password</h2>

                <form id="resetPasswordForm" novalidate>

                    <!-- New Password -->
                    <div class="form-group">
                        <label for="newPassword" class="form-label">New Password</label>
                        <div class="input-wrapper">
                            <input
                                type="password"
                                id="newPassword"
                                class="form-input"
                                placeholder="Enter new password"
                                autocomplete="new-password"
                            />
                            <!-- Eye toggle – hidden / visible SVG swap via JS -->
                            <button type="button" class="eye-btn" id="toggleNew" aria-label="Show / hide password">
                                <!-- eye-off icon (default – password hidden) -->
                                <svg id="eyeOffNew" class="eye-svg" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                                <!-- eye-on icon (shown when password is visible) -->
                                <svg id="eyeOnNew" class="eye-svg hidden" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <!-- Per-field hint shown below the New Password input only -->
                        <p class="helper-text">
                            <span class="chk">&#10003;</span> Min 8 chars
                            &nbsp;|&nbsp;
                            <span class="chk">&#10003;</span> Letters, numbers &amp; special chars
                        </p>
                    </div>

                    <!-- Confirm Password -->
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <div class="input-wrapper">
                            <input
                                type="password"
                                id="confirmPassword"
                                class="form-input"
                                placeholder="Re-enter password"
                                autocomplete="new-password"
                            />
                            <button type="button" class="eye-btn" id="toggleConfirm" aria-label="Show / hide confirm password">
                                <svg id="eyeOffConfirm" class="eye-svg" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                                <svg id="eyeOnConfirm" class="eye-svg hidden" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary" id="resetBtn" disabled>
                            Reset Password
                        </button>
                        <button type="button" class="btn btn-outline" id="backBtn">
                            Back to Login
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
