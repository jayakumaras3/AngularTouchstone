<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise Learning Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:FILL@0..1&opsz@20..24&wght@300..700&GRAD@-25..200"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="catalog-layout-container">
        <section class="catalog-card">
          <div class="catalog-flex-row">
            <aside id="catalogSidebar" class="catalog-sidebar" aria-label="Filter sidebar">
              <button id="sidebarCloseBtn" class="sidebar-close-btn" aria-label="Close filters">
                <span class="material-symbols-rounded" aria-hidden="true">close</span>
              </button>

              <div class="filter-section">
                <h2 class="filter-section-title">FILTER BY CATEGORY</h2>
                <nav class="filter-content" id="categoryList"></nav>
              </div>

              <div class="filter-section">
                <h2 class="filter-section-title">FILTER BY LANGUAGES</h2>
                <div class="filter-content" id="languageList"></div>
              </div>

              <div id="resetFilterContainer" class="reset-filter-container hidden">
                <button id="resetFiltersBtn" class="reset-filter-btn" type="button">
                  <span class="icon icon-reset" aria-hidden="true"></span>
                  <span>Reset Filters</span>
                </button>
              </div>
            </aside>

            <div id="sidebarOverlay" class="sidebar-overlay"></div>

            <main class="catalog-main-content">
              <div class="top-toolbar-container">
                <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Toggle filters">
                  <span class="material-symbols-rounded" aria-hidden="true">menu</span>
                </button>

                <section class="search-toolbar">
                  <div class="view-toggle-group" role="group" aria-label="View mode">
                    <button class="view-btn active" data-view="grid" type="button" aria-label="Grid view">
                      <span class="material-symbols-rounded view-symbol" aria-hidden="true">grid_view</span>
                    </button>
                    <button class="view-btn" data-view="list" type="button" aria-label="List view">
                      <span class="material-symbols-rounded view-symbol" aria-hidden="true">view_list</span>
                    </button>
                  </div>

                  <div class="search-field">
                    <span class="material-symbols-rounded search-symbol" aria-hidden="true">search</span>
                    <input id="searchInput" type="text" placeholder="Search Courses" autocomplete="off" />
                    <button id="clearSearchBtn" class="clear-search" type="button" aria-label="Clear search">✕</button>
                  </div>
                </section>
              </div>

              <section class="content-stage">
                <div id="gridView" class="course-grid"></div>
                <div id="scrollLoader" class="scroll-loader hidden">Loading more courses...</div>

                <div id="listView" class="tile-table-container hidden">
                  <table class="tile-table" aria-label="Course list table">
                    <thead>
                      <tr>
                        <th data-sort="id">Id <span class="sort-indicator"></span></th>
                        <th data-sort="title">Course Title <span class="sort-indicator"></span></th>
                        <th data-sort="language">Language <span class="sort-indicator"></span></th>
                        <th data-sort="category">Categories <span class="sort-indicator"></span></th>
                        <th data-sort="duration">Duration <span class="sort-indicator"></span></th>
                      </tr>
                    </thead>
                    <tbody id="listTableBody"></tbody>
                  </table>

                  <div id="paginationBar" class="pagination-bar">
                    <span>Items per page:</span>
                    <select id="pageSizeSelect">
                      <option value="5">5</option>
                      <option value="10" selected>10</option>
                      <option value="20">20</option>
                    </select>
                    <span id="rangeText" class="range-text"></span>
                    <button id="prevPageBtn" type="button" aria-label="Previous page">‹</button>
                    <button id="nextPageBtn" type="button" aria-label="Next page">›</button>
                  </div>
                </div>

                <div id="emptyState" class="empty-state hidden">
                  <div class="empty-state-card">
                    <div class="empty-icon">⌕</div>
                    <h3>No results found</h3>
                    <p>Try adjusting your search or filters.</p>
                    <button id="emptyResetBtn" type="button">Reset Filters</button>
                  </div>
                </div>
              </section>
            </main>
          </div>
        </section>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
