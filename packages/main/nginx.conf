# ============================================================================
# DEPLOYMENT INSTRUCTIONS
# ============================================================================
# 1. Update server names (example.com) with your actual domain
# 2. If not using HTTPS yet, you can comment out the HTTPS block temporarily
#    and modify the HTTP block to serve content directly
# 3. For production HTTPS, use Let's Encrypt:
#    - Install certbot: apt-get install certbot python3-certbot-nginx
#    - Generate certificate: certbot certonly --standalone -d your-domain.com
#    - Update paths in ssl_certificate and ssl_certificate_key
# 4. Test nginx configuration: nginx -t
# 5. Reload nginx: nginx -s reload
# 6. Verify headers are being set: curl -I https://your-domain.com

# ============================================================================
# TESTING & VERIFICATION
# ============================================================================
# Test security headers with curl:
# curl -I https://your-domain.com
# 
# Verify headers are set properly - look for:
# X-Content-Type-Options: nosniff
# X-Frame-Options: DENY
# X-XSS-Protection: 1; mode=block
# Referrer-Policy: strict-origin-when-cross-origin
# Strict-Transport-Security: max-age=31536000
# Content-Security-Policy: ...
# Permissions-Policy: interest-cohort=()
#
# Use online tools for comprehensive security testing:
# - https://securityheaders.com
# - https://observatory.mozilla.org
# - https://www.ssl-shopper.com/ssl-checker.html
