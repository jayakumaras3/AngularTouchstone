# 🔐 Nginx Security Configuration
# 
# This configuration file includes security headers and best practices
# to protect your Angular application from common web vulnerabilities
# 
# Usage: Copy this content to your nginx.conf or include it in your server block

# Hide nginx version from response headers
server_tokens off;

# Disable unwanted HTTP methods
limit_except GET HEAD POST OPTIONS {
    deny all;
}

# Server block configuration
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;  # Replace with your domain

    # Redirect all HTTP requests to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server block (recommended)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;  # Replace with your domain

    # 🔐 SSL/TLS Configuration (generate certificates with Let's Encrypt for production)
    ssl_certificate /etc/ssl/certs/your_certificate.crt;  # Update path
    ssl_certificate_key /etc/ssl/private/your_private_key.key;  # Update path
    
    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # 🔐 Security Headers
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Prevent clickjacking attacks (allow only same origin)
    add_header X-Frame-Options "DENY" always;
    
    # Enable XSS protection in older browsers
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Control referrer information
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Enforce HTTPS for future connections (recommended: use in production after testing)
    # Adjust max-age (in seconds) as needed. Start with 300 seconds for testing
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Content Security Policy (adjust as needed for your application)
    # This is a balanced policy - tighten it based on your specific needs
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    
    # Disable FLoC (Federated Learning of Cohorts) - privacy protection
    add_header Permissions-Policy "interest-cohort=()" always;
    
    # Remove server header
    server_tokens off;

    # Root directory for Angular app
    root /usr/share/nginx/html;  # Update based on your deployment path

    # 🔐 Security: Prevent access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to environment files
    location ~ \.env {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to config files
    location ~ (^|/)\. {
        return 404;
    }

    # 🔐 Static assets with long cache (use cache busting in Angular)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # 🔐 Disable caching for HTML files (Angular app shell)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 🔐 Angular routing fallback - serve index.html for all non-file requests
    location / {
        # Try to serve the requested file, then directory, then fall back to index.html
        try_files $uri $uri/ /index.html;
        
        # Security headers for index.html
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # 🔐 Deny access to Node modules
    location /node_modules {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 🔐 Logging configuration
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # 🔐 Rate limiting (optional but recommended)
    # Define rate limit zone in http block:
    # limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    # Then use in location block:
    # limit_req zone=general burst=20 nodelay;

    # 🔐 Client body size limit (prevent large uploads)
    client_max_body_size 10m;

    # 🔐 Request timeout
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;
}

# ============================================================================
